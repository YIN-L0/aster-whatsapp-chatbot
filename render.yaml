# Render Blueprint: one web service (FastAPI + in-process scheduler) and one Postgres.
# Keep numInstances at 1 – the demo build uses in-process per-user locks and scheduler.
services:
  - type: web
    name: aster-whatsapp-demo
    runtime: python
    plan: starter            # free plan sleeps after 15 min, which makes WhatsApp replies slow
    region: ohio
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: aster-db-ohio
          property: connectionString   # internal URL – works only in the same region as this service
      - key: ADMIN_TOKEN
        value: admin-key
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DEMO_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: ANTHROPIC_EFFORT
        value: low
      - key: ANTHROPIC_SPEED
        value: fast            # Opus fast mode: ~3s replies instead of ~7s, ~2x price
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: STAFF_WHATSAPP_NUMBERS
        sync: false

databases:
  # Same region as the web service: each reply makes ~20 queries, and a cross-region database added 2–3 s per reply.
  # (The first database, aster-db, was created in Oregon because no region was set; free databases also expire.)
  - name: aster-db-ohio
    databaseName: aster
    region: ohio
    plan: basic-256mb
