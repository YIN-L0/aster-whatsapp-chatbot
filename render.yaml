# Render Blueprint: one web service (FastAPI + in-process scheduler) and one Postgres.
# Keep numInstances at 1 – the demo build uses in-process per-user locks and scheduler.
services:
  - type: web
    name: aster-whatsapp-demo
    runtime: python
    plan: starter            # free plan sleeps after 15 min, which makes WhatsApp replies slow
    region: ohio
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: aster-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: openai
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DEMO_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: ANTHROPIC_EFFORT
        value: low
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: STAFF_WHATSAPP_NUMBERS
        sync: false

databases:
  - name: aster-db
    databaseName: aster
    plan: free
