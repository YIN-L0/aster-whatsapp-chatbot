services:
  s_dna_test: {label: DNA nutrition test, kind: buy}
  s_dna_coaching: {label: Nutrition coaching, kind: book}
  s_dna_upload: {label: Report from existing DNA data, kind: buy}
  s_programs: {label: Goal program, kind: info}
  s_glp1_program: {label: GLP-1 support program, kind: subscribe}
  s_dietitian: {label: Registered dietitian session, kind: book}
  s_fitness: {label: Fitness coaching, kind: book}
  s_sports_nutrition: {label: Sports nutrition coaching, kind: book}
  s_gut_eval: {label: Gut health evaluation, kind: book}
  s_labs: {label: Lab tests, kind: book}
  s_nutrient_labs: {label: Nutrient blood panel, kind: subscribe}
  s_genetic_counsel: {label: Genetic counseling, kind: book}
  s_medspa: {label: Med spa consultation (Essence), kind: referral}
  s_medical_weight: {label: Medical weight management consultation (Essence), kind: referral}

# Approved sentences the reply may use (the LLM rephrases, never adds facts)
notes:
  bmi_muscle: "BMI doesn't tell muscle from fat, so with your strength training it may overstate things."
  bmi_older: "After 65 a BMI a little above 25 isn't a concern by itself."
  special_population: "Because adult BMI and calorie guides don't fit your situation, I'll keep this general and ask our team to reach out."
  nutrition_concern: "A dietitian on our team can help you make sure you're getting what you need – I'll ask them to reach out."
  red_flag: "Some of what you describe should be checked by a clinician soon, so I've let the team know."
  glp1_side_effects: "Please let your prescribing clinician know about the side effects."
  no_info: "No problem – you don't need to share personal health information to get started."
